<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open World Roam Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">Use WASD / Arrow keys to move. Move the mouse to look around.</div>
  <div id="fpsCounter" title="Current frames per second" style="position:fixed;left:10px;top:46px;z-index:12;color:#fff;font-family:Segoe UI,Arial;font-size:13px">FPS: --</div>
  <div id="debugOverlay" class="hidden" title="Debug overlay" style="position:fixed;right:10px;top:10px;z-index:60;width:320px;max-height:60vh;overflow:auto;padding:8px;border-radius:8px;background:rgba(0,0,0,0.7);font-size:12px;color:#fff;display:none"></div>
  <div id="controls">
    <label for="perspective">Perspective</label>
    <select id="perspective">
      <option value="top">Top-down</option>
      <option value="follow">Follow (close)</option>
      <option value="overview">Overview (zoomed out)</option>
    </select>
    <label style="margin-left:10px"><input type="checkbox" id="mode3d"> 3D Mode</label>
    <label style="margin-left:8px">Graphics</label>
    <select id="graphics" style="margin-left:4px">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <label style="margin-left:8px">Character</label>
    <select id="character" style="margin-left:4px">
      <option value="soham">⚡ Soham (Athlete) - Blue</option>
      <option value="shreyas">⚖️ Shreyas (All-Rounder) - Black</option>
      <option value="akshata">🔥 Akshata (Fierce) - Red</option>
      <option value="namal">💝 Namal (Sweet) - White</option>
      <option value="mehwish">✨ Mehwish (Graceful Beauty) - Pink</option>
    </select>
    <label style="margin-left:8px">Vehicle</label>
    <select id="vehicle" style="margin-left:4px">
      <option value="walking">Walking 🚶</option>
      <option value="scooter">Scooter 🛴</option>
      <option value="bike">Bike 🏍️</option>
      <option value="car">Car 🚗</option>
      <option value="autorickshaw">Auto 🛺</option>
      <option value="bus">Bus 🚌</option>
      <option value="plane">Plane ✈️</option>
    </select>
    <button id="settingsToggle" title="Open settings" style="margin-left:12px">Settings ⚙️</button>
  <!-- Multiplayer removed for static deployment -->
  </div>
  <div id="settingsPanel" class="hidden">
    <h3>⚙️ Game Settings & Characters</h3>
    <div class="setting-row">
      <label>Current Character Info</label>
      <div id="characterInfo" style="background:rgba(255,255,255,0.1);padding:8px;border-radius:4px;margin:4px 0;font-size:12px">
        <div id="charName" style="font-weight:bold;margin-bottom:4px">Character: Loading...</div>
        <div id="charDesc" style="font-size:11px;line-height:1.4">Select a character to see details</div>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0">
    <h3>Graphics Settings</h3>
    <div class="setting-row">
      <label>Presets</label>
      <div>
        <button id="presetLow">Low</button>
        <button id="presetMed">Medium</button>
        <button id="presetHigh">High</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="shadowQuality">Shadows</label>
      <select id="shadowQuality">
        <option value="off">Off</option>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="particleQuality">Particles</label>
      <select id="particleQuality">
        <option value="off">Off</option>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="fogDensity">Fog</label>
      <input id="fogDensity" type="range" min="0" max="1" step="0.01" value="0.15">
      <span id="fogValue">0.15</span>
    </div>
    <div class="setting-row">
      <label for="bloomToggle">Bloom (glow)</label>
      <input id="bloomToggle" type="checkbox">
    </div>
    <div class="setting-row">
      <label for="uiTheme">UI Theme</label>
      <select id="uiTheme">
        <option value="dark" selected>Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Diagnostics</label>
      <div>
        <button id="runDiagnostics">Run Diagnostics</button>
        <button id="showDebug">Show Debug</button>
      </div>
    </div>
    <div style="text-align:right;margin-top:8px"><button id="settingsClose">Close</button></div>
  </div>
  <canvas id="world"></canvas>
  <div id="scene3d" style="display:none;position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0"></div>
  <script src="audio.js"></script>
  <script src="main.js"></script>
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="main3d.js"></script>
</body>
</html>
